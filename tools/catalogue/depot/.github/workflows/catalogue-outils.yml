# Régénère chaque jour le catalogue d'outils de PCPerfSuite et ouvre (ou met à jour) une PR. La CI n'a pas de clé :
# Denis relit la PR, signe le catalogue en local (outils/signer.cs) et pousse la signature avant de fusionner. Une PR
# fusionnée sans signature retire l'ancienne : l'app refuse alors le catalogue en ligne et garde le dernier connu.
name: Catalogue d'outils

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalogue-outils
  cancel-in-progress: false

jobs:
  regenerer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Régénérer le catalogue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet run outils/generer.cs -- --catalogue catalogue-outils.json --sources sources.json --resume "$RUNNER_TEMP/resume.md"

      - name: Ouvrir ou mettre à jour la PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- catalogue-outils.json; then
            echo "Catalogue déjà à jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C maj-catalogue
          # L'ancienne signature ne vaut plus pour le nouveau contenu : elle est retirée, Denis en pose une neuve.
          git rm --quiet --ignore-unmatch catalogue-outils.json.sig
          git add catalogue-outils.json
          git commit --quiet -m "Met à jour le catalogue d'outils"
          git push --force --quiet origin maj-catalogue
          if gh pr view maj-catalogue --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit maj-catalogue --body-file "$RUNNER_TEMP/resume.md"
          else
            gh pr create --head maj-catalogue --base main --title "Mise à jour du catalogue d'outils" --body-file "$RUNNER_TEMP/resume.md"
          fi
