# Régénère chaque jour le catalogue d'outils de PCPerfSuite et ouvre (ou met à jour) une PR. La CI n'a pas de clé :
# Denis relit la PR, signe le catalogue en local avec une copie de confiance du signataire, et pousse la signature
# avant de fusionner. Une PR fusionnée sans signature retire l'ancienne : l'app refuse alors le catalogue en ligne et
# garde le dernier connu.
#
# Deux jobs : la génération (paquet NuGet, contenu tiers) tourne avec un jeton en lecture seule et sans identifiants
# git ; seule la publication écrit, et elle refuse tout commit qui toucherait autre chose que catalogue-outils.json.
name: Catalogue d'outils

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-outils
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Régénérer le catalogue
        env:
          # Jeton du job, en lecture seule : il ne sert qu'à relever le quota de l'API de GitHub.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet run outils/generer.cs -- --catalogue catalogue-outils.json --sources sources.json --resume resume.md
          cat resume.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalogue
          path: |
            catalogue-outils.json
            resume.md
          retention-days: 3

  publier:
    needs: generer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalogue
          path: genere

      - name: Ouvrir ou mettre à jour la PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp genere/catalogue-outils.json catalogue-outils.json
          if git diff --quiet -- catalogue-outils.json; then
            echo "Catalogue déjà à jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C maj-catalogue
          # L'ancienne signature ne vaut plus pour le nouveau contenu : elle est retirée, Denis en pose une neuve.
          git rm --quiet --ignore-unmatch catalogue-outils.json.sig
          git add catalogue-outils.json
          git commit --quiet -m "Met à jour le catalogue d'outils"
          changed="$(git diff --name-only HEAD~1 HEAD | sort | tr '\n' ' ')"
          if [ "$changed" != "catalogue-outils.json " ] && [ "$changed" != "catalogue-outils.json catalogue-outils.json.sig " ]; then
            echo "Commit inattendu (fichiers : $changed) : rien n'est publié." >&2
            exit 1
          fi
          git push --force --quiet origin maj-catalogue
          if gh pr view maj-catalogue --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit maj-catalogue --body-file genere/resume.md
          else
            gh pr create --head maj-catalogue --base main --title "Mise à jour du catalogue d'outils" --body-file genere/resume.md
          fi
